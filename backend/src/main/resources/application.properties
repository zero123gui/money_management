spring.application.name=financeiro-backend

# Valores sensíveis vêm de variáveis de ambiente. Em desenvolvimento, o
# arquivo .env (fora do Git) as fornece; variáveis reais do sistema têm
# prioridade sobre ele. Os dois caminhos cobrem rodar a partir de backend/
# ou da raiz do repositório.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financeiro}
spring.datasource.username=${DB_USERNAME:financeiro_app}
spring.datasource.password=${DB_PASSWORD}

# Só o Flyway cria ou altera tabelas; o Hibernate apenas confere o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Paginação com os nomes de parâmetro do contrato (docs/API.md, seção 1.7).
spring.data.web.pageable.page-parameter=pagina
spring.data.web.pageable.size-parameter=tamanho
spring.data.web.pageable.default-page-size=50
spring.data.web.pageable.max-page-size=200

# Erros no formato RFC 9457 (Problem Details).
spring.mvc.problemdetails.enabled=true

# Swagger desligado salvo pedido explícito: se a variável faltar em produção,
# a documentação da API continua fora do ar (docs/API.md, seção 1.8).
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# JWT: a chave é um texto em Base64 com pelo menos 32 bytes (backend/.env.example).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}

# Falhas seguidas de login que bloqueiam o e-mail, e por quanto tempo.
app.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.login.block-duration=${LOGIN_BLOCK_DURATION:PT15M}

# Cadastro restrito salvo pedido explícito: se a variável faltar em produção,
# ninguém fora da lista cria conta. Testes e homologação usam SIGNUP_RESTRICTED=false.
app.signup.restricted=${SIGNUP_RESTRICTED:true}
app.signup.allowed-emails=${SIGNUP_ALLOWED_EMAILS:}
